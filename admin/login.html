<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — RK DIGITAL STUDIO</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/favicon-48x48.png">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">

  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top center, rgba(37, 99, 235, 0.15) 0%, transparent 60%), #070b14;
      position: relative;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #0e1526;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 10;
    }
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .login-logo img {
      height: 38px;
      width: auto;
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .login-header p {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .password-wrap {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .password-toggle:hover {
      color: #ffffff;
    }
    .login-error-alert {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
    }
    .login-footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 0.82rem;
      color: #64748b;
    }
    .login-footer-links a {
      color: #38bdf8;
      text-decoration: none;
    }
    .login-footer-links a:hover {
      text-decoration: underline;
    }
  </style>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <a href="/">
          <img src="../assets/logo.svg" alt="RK DIGITAL STUDIO Logo">
        </a>
      </div>

      <div class="login-header">
        <h1>Admin Control Panel</h1>
        <p>Sign in with your authorized studio administrator account</p>
      </div>

      <div id="loginError" class="login-error-alert" role="alert">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="loginErrorText">Invalid email or password</span>
      </div>

      <form id="adminLoginForm" novalidate>
        <div class="admin-form-group">
          <label for="adminEmail" class="admin-form-label">
            Admin Email Address <span class="req">*</span>
          </label>
          <input 
            type="email" 
            id="adminEmail" 
            name="email" 
            class="admin-form-input" 
            placeholder="e.g. contact@rkdigitaistudio.in" 
            required 
            autocomplete="email"
            value="contact@rkdigitaistudio.in"
          >
        </div>

        <div class="admin-form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="adminPassword" class="admin-form-label" style="margin-bottom: 0;">
              Password <span class="req">*</span>
            </label>
          </div>
          <div class="password-wrap">
            <input 
              type="password" 
              id="adminPassword" 
              name="password" 
              class="admin-form-input" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
          <label class="admin-checkbox-group">
            <input type="checkbox" id="rememberMe" checked>
            <span style="color: #cbd5e1;">Keep me signed in</span>
          </label>
          <a href="../#contact" style="color: #64748b; text-decoration: none; font-size: 0.8rem;">Need access?</a>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block">
          <span id="loginBtnText">Sign In to Dashboard</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="login-footer-links">
        <a href="/">← Return to Public Website</a>
        <p style="margin-top: 10px; font-size: 0.75rem; color: #475569;">
          Protected by Supabase Auth &amp; Row Level Security.<br>Unauthorized access is prohibited and logged.
        </p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/env.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('adminLoginForm');
      const emailInput = document.getElementById('adminEmail');
      const passwordInput = document.getElementById('adminPassword');
      const rememberCheckbox = document.getElementById('rememberMe');
      const submitBtn = document.getElementById('loginSubmitBtn');
      const btnText = document.getElementById('loginBtnText');
      const errorAlert = document.getElementById('loginError');
      const errorText = document.getElementById('loginErrorText');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');

      // Toggle password visibility
      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          togglePasswordBtn.innerHTML = isPassword
            ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
            : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        });
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const remember = rememberCheckbox.checked;

        if (!email || !password) {
          errorAlert.style.display = 'flex';
          errorText.textContent = 'Please enter both your email address and password.';
          return;
        }

        submitBtn.disabled = true;
        btnText.textContent = 'Authenticating...';

        try {
          const result = await window.RK_AUTH.login(email, password, remember);
          if (result.success) {
            btnText.textContent = 'Redirecting...';
            const params = new URLSearchParams(window.location.search);
            const redirectUrl = params.get('redirect') ? decodeURIComponent(params.get('redirect')) : '/admin/';
            window.location.href = redirectUrl;
          } else {
            errorAlert.style.display = 'flex';
            errorText.textContent = result.message || 'Login failed. Please check your credentials.';
            submitBtn.disabled = false;
            btnText.textContent = 'Sign In to Dashboard';
          }
        } catch (err) {
          errorAlert.style.display = 'flex';
          errorText.textContent = 'Authentication error: ' + err.message;
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In to Dashboard';
        }
      });
    });
  </script>
</body>
</html>
