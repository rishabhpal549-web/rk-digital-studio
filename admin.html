<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — RK DIGITAL STUDIO</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">

  <style>
    .portal-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top center, rgba(37, 99, 235, 0.15) 0%, transparent 60%), #070b14;
    }
    .portal-card {
      width: 100%;
      max-width: 420px;
      background: #0e1526;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .portal-logo {
      margin-bottom: 20px;
    }
    .portal-logo img {
      height: 38px;
      width: auto;
    }
    .portal-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
</head>
<body class="admin-body">
  <div class="portal-wrap">
    <div class="portal-card">
      <div class="portal-logo">
        <a href="/">
          <img src="assets/logo.svg" alt="RK DIGITAL STUDIO Logo">
        </a>
      </div>
      <h1 style="font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 6px;">Secure Admin Portal</h1>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px;">Authenticating session...</p>
      <div class="portal-spinner"></div>
      <p id="portalStatus" style="font-size: 0.8rem; color: #64748b; margin-top: 14px;">Verifying administrator access</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('portalStatus');
      try {
        if (window.RK_AUTH && typeof window.RK_AUTH.getSession === 'function') {
          const session = await window.RK_AUTH.getSession();
          if (session && session.isAuthenticated) {
            if (statusEl) statusEl.textContent = 'Session verified. Opening dashboard...';
            window.location.replace('/admin/index.html');
            return;
          }
        }
      } catch (err) {
        console.warn('Auth check exception:', err);
      }
      
      // If not authenticated, route to secure admin login
      if (statusEl) statusEl.textContent = 'Redirecting to login...';
      window.location.replace('/admin/login.html');
    });
  </script>
</body>
</html>
